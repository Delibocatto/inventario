<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EF">
<title>Inventario Delibocatto</title>
<link rel="icon" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#FBF6EF; --cafe:#63240B; --rojo:#990000; --oscuro:#320000; --blanco:#FFFFFF;
  --borde:#E9DDCC; --suave:#7B5E52; --sombra:0 1px 2px rgba(50,0,0,.06),0 4px 14px rgba(50,0,0,.06);
  --ok:#2E7D32; --ok-f:#E8F5E9;
  --comprar:#E08A00; --comprar-t:#8A5300; --comprar-f:#FFF3E0;
  --bajo:#C62828; --bajo-f:#FFEBEE;
  --demas:#546E7A; --demas-f:#ECEFF1;
  --sinlim:#8D7B72; --sinlim-f:#F3EEE9;
  --titulos:'Fraunces', Georgia, 'Times New Roman', serif;
  --texto:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--oscuro);font-family:var(--texto);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--titulos);color:var(--cafe);margin:0 0 .4em;line-height:1.2;font-weight:600}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.12rem}
p{margin:.3em 0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.oculto{display:none !important}
.suave{color:var(--suave)}
.peq{font-size:.9rem}

/* Login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
#login .caja{width:100%;max-width:420px}
#login img{display:block;width:240px;max-width:70%;margin:0 auto 28px}
#login h2{text-align:center}

/* Estructura */
header.top{position:sticky;top:0;z-index:20;background:var(--fondo);border-bottom:1px solid var(--borde);padding:10px 16px calc(10px) 16px;padding-top:max(10px, env(safe-area-inset-top))}
header.top .fila{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top img{height:44px;width:auto}
header.top .fecha{margin-left:auto;text-align:right;font-size:.88rem;color:var(--suave);line-height:1.25}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600}
.sync .punto{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sync.off .punto{background:var(--comprar)}
.sync.pend .punto{background:var(--demas)}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
nav.inferior{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--blanco);border-top:1px solid var(--borde);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px, env(safe-area-inset-bottom))}
nav.inferior button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--suave);font-size:.78rem;font-weight:500;min-height:58px;cursor:pointer;position:relative;border-radius:10px}
nav.inferior button svg{width:26px;height:26px}
nav.inferior button.activo{color:var(--cafe);font-weight:700}
nav.inferior button.activo::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:2px;background:var(--rojo)}

/* Componentes */
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:16px;padding:16px;box-shadow:var(--sombra);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn-prim{background:var(--cafe);color:#fff}
.btn-sec{background:var(--blanco);color:var(--cafe);border-color:var(--cafe)}
.btn-peligro{background:var(--bajo);color:#fff}
.btn-texto{background:none;color:var(--cafe);border:none;padding:10px 8px;min-height:44px}
.btn-bloque{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns > .btn{flex:1 1 140px}
label.campo{display:block;margin-bottom:14px}
label.campo > span{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
label.campo small{display:block;color:var(--suave);font-size:.85rem;margin-top:4px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[inputmode],select,textarea{width:100%;min-height:52px;padding:12px 14px;font-size:1.05rem;font-family:inherit;color:var(--oscuro);background:var(--blanco);border:1.5px solid var(--borde);border-radius:12px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--cafe)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:480px){.tres{grid-template-columns:1fr}}
.error{color:var(--bajo);font-weight:600;font-size:.95rem;margin:6px 0}
.aviso{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.aviso svg{flex:0 0 22px;width:22px;height:22px}
.aviso.adv{background:var(--comprar-f);color:var(--comprar-t)}
.aviso.mal{background:var(--bajo-f);color:var(--bajo)}
.aviso.info{background:var(--sinlim-f);color:var(--oscuro)}

/* Badges de estado */
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 8px;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap}
.badge svg{width:17px;height:17px}
.e-ok{background:var(--ok-f);color:var(--ok)}
.e-comprar{background:var(--comprar-f);color:var(--comprar-t)} .e-comprar svg{color:var(--comprar)}
.e-bajo,.e-negativo{background:var(--bajo-f);color:var(--bajo)}
.e-demas{background:var(--demas-f);color:var(--demas)}
.e-sinlim{background:var(--sinlim-f);color:var(--sinlim)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--borde);background:var(--blanco);color:var(--oscuro);border-radius:999px;padding:8px 14px;font-size:.92rem;font-weight:500;cursor:pointer;min-height:42px}
.chip.activo{background:var(--cafe);border-color:var(--cafe);color:#fff}
.chip .n{opacity:.75;margin-left:4px}

/* Listas */
.grupo-titulo{font-family:var(--titulos);color:var(--cafe);font-size:1.05rem;font-weight:600;margin:18px 4px 8px}
.lista{background:var(--blanco);border:1px solid var(--borde);border-radius:16px;overflow:hidden;box-shadow:var(--sombra)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--borde);cursor:pointer;min-height:64px;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-size:1rem;color:inherit}
.item:last-child{border-bottom:none}
.item:active{background:#FAF5EE}
.item .nom{flex:1;min-width:0;font-weight:600}
.item .nom small{display:block;font-weight:400;color:var(--suave);font-size:.85rem}
.item .cant{font-weight:700;font-size:1.1rem;text-align:right;min-width:84px}
.item .cant.neg{color:var(--bajo)}
.vacio{text-align:center;color:var(--suave);padding:28px 16px}

/* Resumen */
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:520px){.resumen{grid-template-columns:repeat(2,1fr)}}
.res{border-radius:14px;padding:12px;cursor:pointer;border:none;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:86px}
.res .num{font-size:1.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.res .lbl{display:flex;align-items:center;gap:5px;font-weight:600;font-size:.9rem}
.res svg{width:18px;height:18px}

/* Barra */
.barra{position:relative;height:14px;background:#F1E9DE;border-radius:7px;margin:26px 0 30px}
.barra .relleno{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.barra .marca{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--oscuro)}
.barra .marca span{position:absolute;top:22px;transform:translateX(-50%);font-size:.72rem;white-space:nowrap;color:var(--suave)}
.barra .marca.arriba span{top:-20px}

/* Detalle */
.datos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dato{background:var(--fondo);border-radius:12px;padding:10px 12px}
.dato b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.dato span{font-size:.82rem;color:var(--suave)}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(50,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#modal .hoja{background:var(--fondo);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px;padding-bottom:max(20px, env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(50,0,0,.2)}
@media (min-height:700px) and (min-width:600px){#modal{align-items:center}#modal .hoja{border-radius:22px;max-height:88vh}}
#modal .cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
#modal .cab h2{flex:1;margin:0}
#modal .cerrar{background:none;border:none;font-size:1.8rem;line-height:1;color:var(--suave);cursor:pointer;width:44px;height:44px;margin:-8px -8px 0 0}
.alerta-cab{display:flex;align-items:center;gap:10px;color:var(--bajo)}
.alerta-cab svg{width:34px;height:34px}
.alerta-cab h2{color:var(--bajo)}

/* Segmentado */
.seg{display:flex;background:var(--blanco);border:1.5px solid var(--borde);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:10px 6px;font-size:.95rem;font-weight:600;color:var(--suave);cursor:pointer;min-height:46px}
.seg button.activo{background:var(--cafe);color:#fff}

.previa{background:var(--blanco);border:1.5px dashed var(--cafe);border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.previa .flecha{color:var(--suave);margin:0 6px}

/* Conteo */
.fila-conteo{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--borde)}
.fila-conteo:last-child{border-bottom:none}
.fila-conteo input{min-height:48px;text-align:right;font-variant-numeric:tabular-nums}
.fila-conteo.cambio{background:#FFF8EC}
.barra-fija{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;padding:0 16px}
.barra-fija .dentro{max-width:728px;margin:0 auto;display:flex;gap:10px}
.barra-fija .btn{flex:1;box-shadow:0 4px 16px rgba(50,0,0,.25)}

/* Historial */
.mov{padding:14px 16px;border-bottom:1px solid var(--borde)}
.mov:last-child{border-bottom:none}
.mov .cab-mov{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mov .tit{font-weight:700;flex:1}
.mov .cuando{font-size:.85rem;color:var(--suave)}
.mov ul{margin:6px 0 0;padding-left:18px;font-variant-numeric:tabular-nums}
.mov li{margin:2px 0}
.mov .mas{color:var(--ok);font-weight:600} .mov .menos{color:var(--bajo);font-weight:600}
.mov.deshecho .tit,.mov.deshecho ul{text-decoration:line-through;opacity:.55}
.etq{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sinlim-f);color:var(--suave)}

.menu-mas .item svg{width:24px;height:24px;color:var(--cafe);flex:0 0 24px}
.prox{font-size:.75rem;font-weight:700;color:var(--rojo);border:1px solid var(--rojo);border-radius:6px;padding:1px 6px;margin-left:6px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--oscuro);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .25s}
#cargando{min-height:100vh;display:flex;align-items:center;justify-content:center}
#cargando img{width:200px;opacity:.85}
</style>
</head>

/* ============ Utilidades ============ */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase().replace(/\s+/g, " ");
const esNum = (v) => typeof v === "number" && isFinite(v);
const red = (n) => Math.round(n * 1000) / 1000;

function fmtNum(n, dec) {
  const f = Math.pow(10, dec);
  const r = Math.round(Math.abs(n) * f) / f;
  let [e, d] = r.toFixed(dec).split(".");
  e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  if (d) d = d.replace(/0+$/, "");
  return (n < 0 && r !== 0 ? "−" : "") + (d ? e + "," + d : e);
}
function fmtCant(v, unidad) {
  if (!esNum(v)) return "—";
  if (unidad === "u") return fmtNum(v, 2) + " u.";
  if (Math.abs(v) >= 1000) return fmtNum(v / 1000, 2) + " kg";
  return fmtNum(v, 1) + " g";
}
function fmtDelta(v, unidad) { return (v > 0 ? "+" : "") + fmtCant(v, unidad); }
function fmtDinero(v) { return esNum(v) ? "$" + v.toFixed(2).replace(".", ",") : "—"; }
function uLarga(u) { return u === "u" ? "unidades" : "gramos"; }
function uCorta(u) { return u === "u" ? "u." : "g"; }

/* Lee números escritos como 1500, 1.500, 1,5 o 1.5 */
function leerNum(txt) {
  let s = String(txt ?? "").trim().replace(/\s/g, "");
  if (s === "") return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
function aTexto(n) { return esNum(n) ? String(n).replace(".", ",") : ""; }

function fechaLarga(d = new Date()) {
  const t = new Intl.DateTimeFormat("es-EC", { timeZone: ZONA, weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(d);
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function fechaHora(d) {
  return new Intl.DateTimeFormat("es-EC", { timeZone: ZONA, day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
}
function hoyClave() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: ZONA, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
const aFecha = (ts) => ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);

function estado(ing) {
  const s = esNum(ing.stock) ? ing.stock : 0;
  if (s < 0) return "negativo";
  if (esNum(ing.minimo) && s <= ing.minimo) return "bajo";
  if (esNum(ing.puntoCompra) && s <= ing.puntoCompra) return "comprar";
  if (esNum(ing.maximo) && s > ing.maximo) return "demas";
  if (!esNum(ing.minimo) && !esNum(ing.puntoCompra) && !esNum(ing.maximo)) return "sinlim";
  return "ok";
}
function badge(e) {
  const m = ESTADOS[e];
  return `<span class="badge e-${e}">${m.icono}${m.lbl}</span>`;
}
const activos = () => S.ings.filter(i => !i.archivado);
const ordenar = (lista) => [...lista].sort((a, b) => {
  const ca = CATEGORIAS.indexOf(a.categoria), cb = CATEGORIAS.indexOf(b.categoria);
  if (ca !== cb) return (ca < 0 ? 99 : ca) - (cb < 0 ? 99 : cb);
  return a.nombre.localeCompare(b.nombre, "es");
});
const porId = (id) => S.ings.find(i => i.id === id);

function toast(msg, ms = 2800) {
  const t = $("#toast");
  t.textContent = msg; t.classList.remove("oculto"); t.style.opacity = "1";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.classList.add("oculto"), 260); }, ms);
}
function errorGuardar(e) {
  console.error(e);
  const msg = e?.code === "permission-denied" ? "No tienes permiso para guardar. Vuelve a iniciar sesión." : "No se pudo guardar: " + (e?.message || e);
  toast(msg, 6000);
}
const bdLocal = {
  leer(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  borrar(k) { try { localStorage.removeItem(k); } catch {} }
};

function abrirModal(html, { alMontar, cerrable = true } = {}) {

  root.innerHTML = `<div id="modal"><div class="hoja" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = $("#modal");
  if (cerrable) {

    $$("[data-cerrar]", m).forEach(b => b.addEventListener("click", cerrarModal));
  }
  document.body.style.overflow = "hidden";
  if (alMontar) alMontar(m);
  return m;
}
function cerrarModal() { $("#modal-root").innerHTML = ""; document.body.style.overflow = ""; }
function cabecera(titulo) { return `<div class="cab"><h2>${titulo}</h2><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>`; }

function confirmar({ titulo, html, si = "Confirmar", no = "Cancelar", peligro = false }) {
  return new Promise(res => {
    abrirModal(`${cabecera(titulo)}<div>${html}</div>
      <div class="btns" style="margin-top:16px">
        <button class="btn btn-sec" id="c-no">${no}</button>
        <button class="btn ${peligro ? "btn-peligro" : "btn-prim"}" id="c-si">${si}</button>

}

/* ============ Movimientos de stock ============ */
/* cambios: [{ ing, delta }]. Se guarda sin esperar al servidor, para que funcione sin internet. */
function registrarMovimiento({ tipo, motivo = "", nota = "", cambios }) {
  const b = writeBatch(db);
  const ahora = Timestamp.now();
  const items = [], alertas = [];
  for (const { ing, delta } of cambios) {
    const d = red(delta);
    if (!d) continue;
    const antes = esNum(ing.stock) ? ing.stock : 0;
    const despues = red(antes + d);
    items.push({ ingId: ing.id, nombre: ing.nombre, unidad: ing.unidad || "g", delta: d, antes, despues });
    b.update(doc(colIng, ing.id), { stock: increment(d), actualizado: ahora });
    const e0 = estado(ing), e1 = estado({ ...ing, stock: despues });
    if ((e1 === "bajo" || e1 === "negativo") && e0 !== e1) alertas.push({ ...ing, stock: despues });
  }
  if (!items.length) return 0;
  b.set(doc(colMov), { tipo, motivo, nota, items, fecha: ahora, deshecho: false });
  b.commit().catch(errorGuardar);
  if (alertas.length) setTimeout(() => mostrarAlerta(alertas, "Después de este registro, estos ingredientes llegaron a su mínimo o quedaron en negativo:"), 350);
  return items.length;
}

async function deshacerMovimiento(m) {
  const lineas = m.items.map(it => {
    const ing = porId(it.ingId);
    if (!ing) return `<li>${esc(it.nombre)}: ya no existe, se omite.</li>`;
    const nuevo = red((ing.stock || 0) - it.delta);
    return `<li><b>${esc(ing.nombre)}</b>: ${fmtCant(ing.stock, ing.unidad)} <span class="suave">→</span> <b>${fmtCant(nuevo, ing.unidad)}</b>${nuevo < 0 ? ' <span class="error">(negativo)</span>' : ""}</li>`;
  }).join("");
  const ok = await confirmar({
    titulo: "¿Deshacer este registro?",
    html: `<p>El inventario quedará así:</p><ul class="tnum">${lineas}</ul>
      <p class="suave peq">El registro seguirá en el historial, tachado.</p>`,
    si: "Sí, deshacer"
  });
  if (!ok) return;
  const b = writeBatch(db);
  const ahora = Timestamp.now();
  for (const it of m.items) if (porId(it.ingId)) b.update(doc(colIng, it.ingId), { stock: increment(-it.delta), actualizado: ahora });
  b.update(doc(colMov, m.id), { deshecho: true, deshechoEn: ahora });
  b.commit().catch(errorGuardar);
  toast("Registro deshecho");
}

        if (q && !norm(i.nombre).includes(q)) return false;
        return true;
      }));

/* ============ Filas y detalle de ingrediente ============ */
function filaIng(i) {
  const e = estado(i);
  return `<button class="item" data-ing="${i.id}"><span class="nom">${esc(i.nombre)}</span>
    <span class="cant tnum ${i.stock < 0 ? "neg" : ""}">${fmtCant(i.stock || 0, i.unidad)}</span>${badge(e)}</button>`;
}
function enlazarFilasIng(el) { $$("[data-ing]", el).forEach(b => b.onclick = () => detalleIng(b.dataset.ing)); }

function barraNivel(i) {
  if (!esNum(i.maximo) || i.maximo <= 0) return "";
  const tope = Math.max(i.maximo * 1.15, i.stock || 0);
  const pct = (v) => Math.max(0, Math.min(100, (v / tope) * 100));
  const e = estado(i);
  const color = { ok: "var(--ok)", comprar: "var(--comprar)", bajo: "var(--bajo)", negativo: "var(--bajo)", demas: "var(--demas)", sinlim: "var(--sinlim)" }[e];
  const marca = (v, t, arriba) => esNum(v) ? `<div class="marca ${arriba ? "arriba" : ""}" style="left:${pct(v)}%"><span>${t}</span></div>` : "";
  return `<div class="barra"><div class="relleno" style="width:${pct(i.stock || 0)}%;background:${color}"></div>
    ${marca(i.minimo, "Mín.", false)}${marca(i.puntoCompra, "Comprar", true)}${marca(i.maximo, "Máx.", false)}</div>`;
}

function detalleIng(id) {
  const i = porId(id);
  if (!i) return;
  const pu = esNum(i.precio) && esNum(i.presentacion) && i.presentacion > 0 ? i.precio / i.presentacion : null;
  abrirModal(`${cabecera(esc(i.nombre))}
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font-size:2rem;font-weight:700" class="tnum ${i.stock < 0 ? "error" : ""}">${fmtCant(i.stock || 0, i.unidad)}</span>${badge(estado(i))}
    </div>
    <div class="suave peq">${esc(i.categoria || "")} · se mide en ${uLarga(i.unidad)}</div>
    ${barraNivel(i)}
    <div class="datos">
      <div class="dato"><span>Punto de compra</span><b>${fmtCant(i.puntoCompra, i.unidad)}</b></div>
      <div class="dato"><span>Mínimo</span><b>${fmtCant(i.minimo, i.unidad)}</b></div>
      <div class="dato"><span>Máximo</span><b>${fmtCant(i.maximo, i.unidad)}</b></div>
      <div class="dato"><span>Presentación habitual</span><b>${fmtCant(i.presentacion, i.unidad)}</b></div>
      <div class="dato"><span>Precio de la presentación</span><b>${fmtDinero(i.precio)}</b></div>
      <div class="dato"><span>Precio por ${i.unidad === "u" ? "unidad" : "kg"}</span><b>${pu === null ? "—" : fmtDinero(i.unidad === "u" ? pu : pu * 1000)}</b></div>
    </div>
    <button class="btn btn-prim btn-bloque" id="d-ajustar">Ajustar stock</button>
    <div class="btns" style="margin-top:10px">
      <button class="btn btn-sec" id="d-editar">Editar</button>
      <button class="btn btn-sec" id="d-hist">Historial</button>
    </div>`, {
    alMontar: (m) => {
      $("#d-ajustar", m).onclick = () => formAjuste(i.id);
      $("#d-editar", m).onclick = () => formIngrediente(i);
      $("#d-hist", m).onclick = () => { cerrarModal(); S.histIng = i.id; ir("historial"); };
    }
  });
}

/* ============ Ajuste manual ============ */
function formAjuste(id) {
  const i = porId(id);
  if (!i) return;
  let modo = "contada";
  const defMotivo = { contada: "Conteo físico", sumar: "Corrección", restar: "Merma o desperdicio" };
  abrirModal(`${cabecera("Ajustar " + esc(i.nombre))}
    <div class="seg" id="aj-modo">
      <button data-m="contada" class="activo">Cantidad contada</button>
      <button data-m="sumar">Sumar</button>
      <button data-m="restar">Restar</button>
    </div>
    <label class="campo"><span id="aj-lbl">Cantidad que hay ahora (${uLarga(i.unidad)})</span>
      <input id="aj-cant" inputmode="decimal" autocomplete="off"><small id="aj-ayuda"></small></label>
    <div class="previa" id="aj-previa">Stock actual: <b>${fmtCant(i.stock || 0, i.unidad)}</b></div>
    <div id="aj-adv"></div>
    <label class="campo"><span>Motivo</span><select id="aj-motivo">${MOTIVOS.map(x => `<option>${x}</option>`).join("")}</select></label>
    <label class="campo"><span>Nota (opcional)</span><input type="text" id="aj-nota" placeholder="Ej. se cayó una funda"></label>
    <div id="aj-error" class="error"></div>
    <div class="btns"><button class="btn btn-sec" data-cerrar>Cancelar</button><button class="btn btn-prim" id="aj-ok">Guardar ajuste</button></div>`, {
    alMontar: (m) => {
      const inp = $("#aj-cant", m), mot = $("#aj-motivo", m);
      mot.value = defMotivo[modo];
      const calcular = () => {
        const actual = porId(id)?.stock || 0;
        const v = leerNum(inp.value);
        $("#aj-error", m).textContent = "";
        $("#aj-adv", m).innerHTML = "";
        if (v === null || isNaN(v)) {
          $("#aj-previa", m).innerHTML = `Stock actual: <b>${fmtCant(actual, i.unidad)}</b>`;
          $("#aj-ayuda", m).textContent = isNaN(v) ? "Escribe solo números." : "";
          return null;
        }
        $("#aj-ayuda", m).textContent = i.unidad === "g" && Math.abs(v) >= 1000 ? "= " + fmtCant(v, "g") : "";
        const nuevo = red(modo === "contada" ? v : modo === "sumar" ? actual + v : actual - v);
        const delta = red(nuevo - actual);
        $("#aj-previa", m).innerHTML = `${fmtCant(actual, i.unidad)}<span class="flecha">→</span><b>${fmtCant(nuevo, i.unidad)}</b>
          <span class="suave">(${delta === 0 ? "sin cambio" : fmtDelta(delta, i.unidad)})</span>`;
        if (nuevo < 0) $("#aj-adv", m).innerHTML = `<div class="aviso mal">${I.alerta}<div>El stock quedará en negativo. Puedes guardarlo, pero revisa si falta registrar algo.</div></div>`;
        return { nuevo, delta, v };
      };
      $$("#aj-modo button", m).forEach(b => b.onclick = () => {
        modo = b.dataset.m;
        $$("#aj-modo button", m).forEach(x => x.classList.toggle("activo", x === b));
        $("#aj-lbl", m).textContent = (modo === "contada" ? "Cantidad que hay ahora" : modo === "sumar" ? "Cantidad a sumar" : "Cantidad a restar") + ` (${uLarga(i.unidad)})`;
        mot.value = defMotivo[modo];
        calcular();
      });
      inp.addEventListener("input", calcular);
      setTimeout(() => inp.focus(), 50);
      $("#aj-ok", m).onclick = () => {
        const r = calcular();
        if (!r) { $("#aj-error", m).textContent = "Escribe una cantidad."; return; }
        if (modo !== "contada" && r.v < 0) { $("#aj-error", m).textContent = "Escribe la cantidad sin signo; elige Sumar o Restar arriba."; return; }
        if (r.delta === 0) { $("#aj-error", m).textContent = "La cantidad es igual a la actual, no hay nada que ajustar."; return; }
        cerrarModal();
        registrarMovimiento({ tipo: "ajuste", motivo: mot.value, nota: $("#aj-nota", m).value.trim(), cambios: [{ ing: porId(id), delta: r.delta }] });
        toast("Ajuste guardado");
      };
    }
  });
}

/* ============ Conteo físico: revisión ============ */
function revisarConteo() {
  const b = bdLocal.leer("conteo-borrador") || {};
  const cambios = [], errores = [];
  for (const [id, txt] of Object.entries(b)) {
    const ing = porId(id);
    if (!ing || ing.archivado) continue;
    const v = leerNum(txt);
    if (v === null) continue;
    if (isNaN(v) || v < 0) { errores.push(ing.nombre); continue; }
    cambios.push({ ing, contado: v, delta: red(v - (ing.stock || 0)) });
  }
  if (errores.length) {
    abrirModal(`${cabecera("Hay cantidades que revisar")}<p>Estas casillas no tienen un número válido:</p><ul>${errores.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      <button class="btn btn-prim btn-bloque" data-cerrar>Corregir</button>`);
    return;
  }
  if (!cambios.length) { toast("No escribiste ninguna cantidad."); return; }
  const conCambio = ordenar(cambios.map(c => c.ing)).map(ing => cambios.find(c => c.ing.id === ing.id));
  const filas = conCambio.map(c => `<div class="item" style="cursor:default"><span class="nom">${esc(c.ing.nombre)}
      <small class="tnum">${fmtCant(c.ing.stock || 0, c.ing.unidad)} → ${fmtCant(c.contado, c.ing.unidad)}</small></span>
      <span class="cant tnum" style="font-size:.95rem;color:${c.delta > 0 ? "var(--ok)" : c.delta < 0 ? "var(--bajo)" : "var(--suave)"}">${c.delta === 0 ? "igual" : fmtDelta(c.delta, c.ing.unidad)}</span></div>`).join("");
  abrirModal(`${cabecera("Revisar conteo")}
    <p>${conCambio.length} ingrediente${conCambio.length === 1 ? "" : "s"} contado${conCambio.length === 1 ? "" : "s"}. Así quedará el inventario:</p>
    <div class="lista" style="margin:12px 0">${filas}</div>
    <div class="btns"><button class="btn btn-sec" data-cerrar>Seguir editando</button><button class="btn btn-prim" id="rc-ok">Confirmar conteo</button></div>`, {
    alMontar: (m) => {
      $("#rc-ok", m).onclick = () => {
        cerrarModal();
        const n = registrarMovimiento({ tipo: "conteo", motivo: "Conteo físico", cambios: conCambio.map(c => ({ ing: c.ing, delta: c.delta })) });
        bdLocal.borrar("conteo-borrador");
        toast(n ? `Conteo guardado: ${n} ingrediente${n === 1 ? "" : "s"} actualizado${n === 1 ? "" : "s"}` : "Conteo revisado: no había diferencias");
        ir("inventario");
      };
    }
  });
}

/* ============ Formulario de ingrediente ============ */
function formIngrediente(ing) {
  const nuevo = !ing;
  const v = ing || { nombre: "", categoria: CATEGORIAS[0], unidad: "g" };
  abrirModal(`${cabecera(nuevo ? "Nuevo ingrediente" : "Editar ingrediente")}
    <label class="campo"><span>Nombre</span><input type="text" id="f-nombre" value="${esc(v.nombre)}" autocomplete="off"></label>
    <div class="dos">
      <label class="campo"><span>Categoría</span><select id="f-cat">${CATEGORIAS.map(c => `<option ${c === v.categoria ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <label class="campo"><span>Se mide en</span><select id="f-unidad"><option value="g" ${v.unidad !== "u" ? "selected" : ""}>Gramos</option><option value="u" ${v.unidad === "u" ? "selected" : ""}>Unidades</option></select></label>
    </div>
    <div class="dos">
      <label class="campo"><span>Presentación habitual</span><input id="f-pres" inputmode="decimal" value="${esc(aTexto(v.presentacion))}" placeholder="opcional">
        <small id="f-pres-ayuda">Lo que trae el paquete que suele comprar, en <span class="u">${uLarga(v.unidad)}</span>.</small></label>
      <label class="campo"><span>Precio de esa presentación ($)</span><input id="f-precio" inputmode="decimal" value="${esc(aTexto(v.precio))}" placeholder="opcional"></label>
    </div>
    <h3 style="margin-top:6px">Límites <span class="suave peq" style="font-family:var(--texto);font-weight:400">(en <span class="u">${uLarga(v.unidad)}</span>, opcionales)</span></h3>
    <div class="tres">
      <label class="campo"><span>Punto de compra</span><input id="f-punto" inputmode="decimal" value="${esc(aTexto(v.puntoCompra))}"><small>Entra a la lista de compras.</small></label>
      <label class="campo"><span>Mínimo</span><input id="f-min" inputmode="decimal" value="${esc(aTexto(v.minimo))}"><small>Alerta.</small></label>
      <label class="campo"><span>Máximo</span><input id="f-max" inputmode="decimal" value="${esc(aTexto(v.maximo))}"><small>Lo más que conviene tener.</small></label>
    </div>
    ${nuevo ? `<label class="campo"><span>Cantidad que tiene ahora</span><input id="f-stock" inputmode="decimal" placeholder="0"><small>Puedes dejarlo vacío y registrarlo después.</small></label>` : ""}
    <div id="f-error" class="error"></div>
    <div class="btns"><button class="btn btn-sec" data-cerrar>Cancelar</button><button class="btn btn-prim" id="f-ok">${nuevo ? "Crear ingrediente" : "Guardar cambios"}</button></div>
    ${!nuevo ? `<button class="btn btn-texto btn-bloque" id="f-archivar" style="margin-top:12px;color:var(--suave)">Archivar ingrediente</button>` : ""}`, {
    alMontar: (m) => {
      $("#f-unidad", m).onchange = (e) => $$(".u", m).forEach(s => s.textContent = uLarga(e.target.value));
      if (nuevo) setTimeout(() => $("#f-nombre", m).focus(), 50);
      $("#f-archivar", m)?.addEventListener("click", () => archivar(ing));
      $("#f-ok", m).onclick = () => {
        const err = (t) => { $("#f-error", m).textContent = t; };
        const nombre = $("#f-nombre", m).value.trim().replace(/\s+/g, " ");
        if (!nombre) return err("Escribe el nombre.");
        const dup = S.ings.find(x => x.id !== ing?.id && norm(x.nombre) === norm(nombre));
        if (dup) return err(dup.archivado ? `Ya existe "${dup.nombre}" en los archivados. Restáuralo desde Ingredientes › Archivados.` : `Ya existe un ingrediente llamado "${dup.nombre}".`);
        const campos = { presentacion: "#f-pres", precio: "#f-precio", puntoCompra: "#f-punto", minimo: "#f-min", maximo: "#f-max" };
        const val = {};
        for (const [k, sel] of Object.entries(campos)) {
          const n = leerNum($(sel, m).value);
          if (n !== null && (isNaN(n) || n < 0)) return err("Revisa los números: solo cifras positivas.");
          val[k] = n;
        }
        if (esNum(val.precio) && !(val.presentacion > 0)) return err("Para guardar el precio, escribe también la presentación (cuánto trae el paquete).");
        if (esNum(val.minimo) && esNum(val.puntoCompra) && val.minimo > val.puntoCompra) return err("El mínimo no puede ser mayor que el punto de compra.");
        if (esNum(val.puntoCompra) && esNum(val.maximo) && val.puntoCompra > val.maximo) return err("El punto de compra no puede ser mayor que el máximo.");
        if (esNum(val.minimo) && esNum(val.maximo) && val.minimo > val.maximo) return err("El mínimo no puede ser mayor que el máximo.");
        const unidad = $("#f-unidad", m).value;
        const datos = { nombre, categoria: $("#f-cat", m).value, unidad, ...val, actualizado: Timestamp.now() };

        if (nuevo) {
          const st = leerNum($("#f-stock", m).value);
          if (st !== null && (isNaN(st) || st < 0)) return err("Revisa la cantidad que tiene ahora.");
          const ref = doc(colIng);
          const b = writeBatch(db);
          b.set(ref, { ...datos, stock: st || 0, archivado: false, creado: Timestamp.now() });
          if (st > 0) b.set(doc(colMov), { tipo: "alta", motivo: "Stock inicial", nota: "", fecha: Timestamp.now(), deshecho: false,
            items: [{ ingId: ref.id, nombre, unidad, delta: st, antes: 0, despues: st }] });
          b.commit().catch(errorGuardar);
          cerrarModal(); toast(`"${nombre}" creado`);
        } else {
          const guardar = () => {
            const b = writeBatch(db);
            b.update(doc(colIng, ing.id), datos);
            b.commit().catch(errorGuardar);
            cerrarModal(); toast("Cambios guardados");
          };
          if (unidad !== (ing.unidad || "g") && (ing.stock || 0) !== 0) {
            confirmar({ titulo: "¿Cambiar la unidad?", html: `<p>${esc(ing.nombre)} tiene ${fmtCant(ing.stock, ing.unidad)} registrados en ${uLarga(ing.unidad)}.
              El número no se convierte: pasará a leerse en ${uLarga(unidad)}. Después conviene hacer un ajuste con la cantidad correcta.</p>`, si: "Cambiar unidad" })
              .then(ok => { if (ok) guardar(); else formIngrediente(ing); });
          } else guardar();
        }
      };
    }
  });
}

async function archivar(ing) {
  const ok = await confirmar({ titulo: `¿Archivar ${esc(ing.nombre)}?`,
    html: `<p>Dejará de aparecer en el inventario y en la lista de compras. Su historial se conserva y puedes restaurarlo cuando quieras desde Ingredientes › Archivados.</p>`,
    si: "Archivar" });
  if (!ok) return;
  const b = writeBatch(db);
  b.update(doc(colIng, ing.id), { archivado: true, actualizado: Timestamp.now() });
  b.commit().catch(errorGuardar);
  toast(`"${ing.nombre}" archivado`);
}

function opcionesArchivado(ing) {
  abrirModal(`${cabecera(esc(ing.nombre))}
    <p class="suave">Archivado · stock registrado: ${fmtCant(ing.stock || 0, ing.unidad)}</p>
    <button class="btn btn-prim btn-bloque" id="oa-rest" style="margin-top:12px">Restaurar al inventario</button>
    <button class="btn btn-texto btn-bloque" id="oa-borrar" style="margin-top:10px;color:var(--bajo)">Eliminar definitivamente</button>`, {
    alMontar: (m) => {
      $("#oa-rest", m).onclick = () => {
        const b = writeBatch(db); b.update(doc(colIng, ing.id), { archivado: false, actualizado: Timestamp.now() }); b.commit().catch(errorGuardar);
        cerrarModal(); toast(`"${ing.nombre}" restaurado`);
      };
      $("#oa-borrar", m).onclick = async () => {
        // En la etapa 2 se impedirá eliminar ingredientes que estén en alguna receta.
        const ok = await confirmar({ titulo: "¿Eliminar definitivamente?", peligro: true, si: "Eliminar",
          html: `<p><b>${esc(ing.nombre)}</b> se borrará y no se podrá recuperar. Los registros pasados del historial conservan su nombre.</p>` });
        if (!ok) return;
        deleteDoc(doc(colIng, ing.id)).catch(errorGuardar);
        toast(`"${ing.nombre}" eliminado`);
      };
    }
  });
}

/* ============ Respaldo ============ */
const serial = (o) => JSON.parse(JSON.stringify(o, (k, v) => (v && typeof v === "object" && typeof v.seconds === "number" && typeof v.nanoseconds === "number") ? { __ts: new Timestamp(v.seconds, v.nanoseconds).toDate().toISOString() } : v));
const deserial = (o) => JSON.parse(JSON.stringify(o), (k, v) => (v && typeof v === "object" && v.__ts) ? Timestamp.fromDate(new Date(v.__ts)) : v);

function descargarArchivo(nombre, contenido, tipo) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function leerTodo() {
  const [ings, movs] = await Promise.all([getDocs(colIng), getDocs(query(colMov, orderBy("fecha", "desc")))]);
  return {
    ingredientes: ings.docs.map(d => ({ id: d.id, ...d.data() })),
    movimientos: movs.docs.map(d => ({ id: d.id, ...d.data() }))
  };
}

async function descargarCopia() {
  try {
    toast("Preparando copia…");
    const datos = await leerTodo();
    const cfg = { ...S.config }; delete cfg.ultimoRespaldo;
    const copia = serial({ app: "inventario-delibocatto", version: 1, creada: new Date().toISOString(), config: cfg, ...datos });
    descargarArchivo(`respaldo-delibocatto-${hoyClave()}.json`, JSON.stringify(copia), "application/json");
    setDoc(cfgRef, { ultimoRespaldo: Timestamp.now() }, { merge: true }).catch(errorGuardar);
    toast("Copia descargada. Guárdala en Drive o envíatela por WhatsApp.", 4500);
    setTimeout(() => { if (S.vista === "respaldo") pintar(); }, 1500);
  } catch (e) { errorGuardar(e); }
}

async function restaurarCopia(archivo) {
  let copia;
  try { copia = JSON.parse(await archivo.text()); } catch { toast("Ese archivo no es una copia válida.", 4000); return; }
  if (copia?.app !== "inventario-delibocatto" || !Array.isArray(copia.ingredientes) || !Array.isArray(copia.movimientos)) {
    toast("Ese archivo no es una copia de este inventario.", 4000); return;
  }
  if (!navigator.onLine) { toast("Para restaurar se necesita internet.", 4000); return; }
  const fecha = copia.creada ? fechaHora(new Date(copia.creada)) : "fecha desconocida";
  abrirModal(`${cabecera("Restaurar copia")}
    <div class="aviso mal">${I.alerta}<div>Se borrarán <b>todos</b> los datos actuales y se reemplazarán por los de la copia del <b>${fecha}</b>
      (${copia.ingredientes.length} ingredientes, ${copia.movimientos.length} movimientos). Esto no se puede deshacer.</div></div>
    <label class="campo"><span>Para confirmar, escribe RESTAURAR</span><input type="text" id="rs-txt" autocomplete="off" autocapitalize="characters"></label>
    <div class="btns"><button class="btn btn-sec" data-cerrar>Cancelar</button><button class="btn btn-peligro" id="rs-ok" disabled>Restaurar</button></div>`, {
    alMontar: (m) => {
      $("#rs-txt", m).oninput = (e) => $("#rs-ok", m).disabled = e.target.value.trim().toUpperCase() !== "RESTAURAR";
      $("#rs-ok", m).onclick = async () => {
        $("#rs-ok", m).disabled = true; $("#rs-ok", m).textContent = "Restaurando…";
        try {
          const datos = deserial(copia);
          const actuales = await leerTodo();
          const ops = [];
          actuales.ingredientes.forEach(d => ops.push(b => b.delete(doc(colIng, d.id))));
          actuales.movimientos.forEach(d => ops.push(b => b.delete(doc(colMov, d.id))));
          datos.ingredientes.forEach(({ id, ...r }) => ops.push(b => b.set(doc(colIng, id), r)));
          datos.movimientos.forEach(({ id, ...r }) => ops.push(b => b.set(doc(colMov, id), r)));
          ops.push(b => b.set(cfgRef, { ...(datos.config || {}), semillaCargada: true, restauradoEn: Timestamp.now() }, { merge: true }));
          for (let k = 0; k < ops.length; k += 400) {
            const b = writeBatch(db);
            ops.slice(k, k + 400).forEach(f => f(b));
            await b.commit();
          }
          cerrarModal(); toast("Copia restaurada", 4000); ir("inicio");
        } catch (e) { cerrarModal(); errorGuardar(e); }
      };
    }
  });
}

function cargarScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function exportarExcel() {
  try {
    if (!window.XLSX) { toast("Preparando Excel…"); await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }
    const XLSX = window.XLSX;
    const inv = ordenar(activos()).map(i => ({
      "Ingrediente": i.nombre, "Categoría": i.categoria, "Unidad": uLarga(i.unidad), "Stock": i.stock || 0, "Estado": ESTADOS[estado(i)].lbl,
      "Punto de compra": i.puntoCompra ?? "", "Mínimo": i.minimo ?? "", "Máximo": i.maximo ?? "",
      "Presentación": i.presentacion ?? "", "Precio presentación ($)": i.precio ?? ""
    }));
    const datos = await leerTodo();
    const hist = [];
    datos.movimientos.forEach(m => (m.items || []).forEach(it => hist.push({
      "Fecha": m.fecha ? fechaHora(aFecha(m.fecha)) : "", "Tipo": m.tipo === "conteo" ? "Conteo físico" : m.tipo === "alta" ? "Stock inicial" : "Ajuste",
      "Motivo": m.motivo || "", "Ingrediente": it.nombre, "Cambio": it.delta, "Antes": it.antes, "Después": it.despues,
      "Unidad": uLarga(it.unidad), "Nota": m.nota || "", "Deshecho": m.deshecho ? "Sí" : ""
    })));
    const libro = XLSX.utils.book_new();
    const h1 = XLSX.utils.json_to_sheet(inv); h1["!cols"] = [{ wch: 24 }, { wch: 24 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 10 }, { wch: 10 }, { wch: 13 }, { wch: 20 }];
    const h2 = XLSX.utils.json_to_sheet(hist); h2["!cols"] = [{ wch: 20 }, { wch: 14 }, { wch: 20 }, { wch: 24 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 24 }, { wch: 9 }];
    XLSX.utils.book_append_sheet(libro, h1, "Inventario");
    XLSX.utils.book_append_sheet(libro, h2, "Historial");
    const bin = XLSX.write(libro, { bookType: "xlsx", type: "array" });
    descargarArchivo(`inventario-delibocatto-${hoyClave()}.xlsx`, new Blob([bin], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  } catch (e) { console.error(e); toast("No se pudo crear el Excel. Revisa la conexión a internet.", 4500); }
}

/* ============ Datos en tiempo real ============ */
function suscribir() {
  desuscribir.forEach(f => f()); desuscribir = [];
  let pIng = false, pMov = false;
  desuscribir.push(onSnapshot(colIng, { includeMetadataChanges: true }, (snap) => {
    S.ings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.ingsListos = true; pIng = snap.metadata.hasPendingWrites; S.pendientes = pIng || pMov;
    refrescar(); revisarAlertaDiaria();
  }, errorGuardar));
  desuscribir.push(onSnapshot(query(colMov, orderBy("fecha", "desc"), limit(300)), { includeMetadataChanges: true }, (snap) => {
    S.movs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    pMov = snap.metadata.hasPendingWrites; S.pendientes = pIng || pMov;
    refrescar();
  }, errorGuardar));
  desuscribir.push(onSnapshot(cfgRef, (snap) => {
    S.config = snap.data() || {}; S.cfgListo = true;
    refrescar(); revisarAlertaDiaria();
  }, errorGuardar));
}

function revisarAlertaDiaria() {
  if (S.alertaRevisada || !S.ingsListos || !S.cfgListo) return;
  S.alertaRevisada = true;
  const hoy = hoyClave();
  if (S.config.ultimaAlerta === hoy) return;
  const bajos = ordenar(activos().filter(i => ["bajo", "negativo"].includes(estado(i))));
  if (!bajos.length) return;
  setDoc(cfgRef, { ultimaAlerta: hoy }, { merge: true }).catch(() => {});
  if (!$("#modal")) mostrarAlerta(bajos, "Estos ingredientes están en su mínimo o por debajo:");
}

async function cargarSemillaSiHaceFalta() {
  try {
    const c = await getDoc(cfgRef);
    if (c.exists() && c.data().semillaCargada) return;
    const existentes = await getDocsFromServer(colIng);
    if (!existentes.empty) { await setDoc(cfgRef, { semillaCargada: true }, { merge: true }); return; }
    const b = writeBatch(db);
    const ahora = Timestamp.now();
    for (const [nombre, categoria, presentacion] of SEMILLA) {
      b.set(doc(colIng), { nombre, categoria, unidad: "g", presentacion, precio: null, puntoCompra: null, minimo: null, maximo: null,
        stock: 0, archivado: false, creado: ahora, actualizado: ahora });
    }
    b.set(cfgRef, { semillaCargada: true, creado: ahora }, { merge: true });
    await b.commit();
    toast(`Se cargaron los ${SEMILLA.length} ingredientes del Excel`, 4000);
  } catch (e) { console.error("Semilla:", e); }
}

/* ============ Inicio de sesión ============ */
function mostrar(id) { ["#cargando", "#login", "#app"].forEach(s => $(s).classList.toggle("oculto", s !== id)); }

$("#l-entrar").onclick = async () => {
  const correo = $("#l-correo").value.trim(), clave = $("#l-clave").value;
  const err = $("#l-error");
  err.textContent = "";
  if (!correo || !clave) { err.textContent = "Escribe el correo y la contraseña."; return; }
  $("#l-entrar").disabled = true; $("#l-entrar").textContent = "Entrando…";
  try { await signInWithEmailAndPassword(auth, correo, clave); $("#l-clave").value = ""; }
  catch (e) {
    err.textContent = {
      "auth/invalid-credential": "Correo o contraseña incorrectos.", "auth/wrong-password": "Correo o contraseña incorrectos.",
      "auth/user-not-found": "Correo o contraseña incorrectos.", "auth/invalid-email": "El correo no es válido.",
      "auth/too-many-requests": "Demasiados intentos. Espera unos minutos.", "auth/network-request-failed": "Sin conexión a internet."
    }[e.code] || "No se pudo entrar (" + e.code + ").";
  } finally { $("#l-entrar").disabled = false; $("#l-entrar").textContent = "Entrar"; }
};
$("#l-clave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#l-entrar").click(); });

onAuthStateChanged(auth, (user) => {
  if (user) {
    S.user = user; S.alertaRevisada = false;
    $("#h-fecha").textContent = fechaLarga();
    mostrar("#app");
    ir("inicio");
    suscribir();
    cargarSemillaSiHaceFalta();
  } else {
    desuscribir.forEach(f => f()); desuscribir = [];
    Object.assign(S, { user: null, ings: [], movs: [], config: {}, ingsListos: false, cfgListo: false });
    cerrarModal();
    mostrar("#login");
  }
});

/* La fecha del encabezado se actualiza si la aplicación queda abierta de un día para otro */
setInterval(() => { if (S.user) $("#h-fecha").textContent = fechaLarga(); }, 60000);
</script>
